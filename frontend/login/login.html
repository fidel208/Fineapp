<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fineapp</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <article id="account">
      <div class="signup-cont" id="signup-cont">
        <div class="signup-words">
          <h1>Sign up</h1>
          <p>Fill in your details to create an account</p>
        </div>
        <form action="" method="" id="signup-form">
          <span id="top">
            <label for="email"
              >Email Address <span aria-label="required">*</span></label
            >
            <input type="email" name="email" id="email" placeholder="eg. johnjustin@gmail.com" required />
          </span>
          <span id="namepass">
            <span>
              <label for="signup-name"
                >Username <span aria-label="required">*</span></label
              >
              <input type="text" name="signup-name" id="signup-name" placeholder="eg. Fidel" required />
            </span>
            <span>
              <label for="signup-pass"
                >Password <span aria-label="required">*</span></label
              >
              <input type="password" name="signup-pass" id="signup-pass" placeholder="Enter your password" required/>
            </span>
          </span>
          <button type="submit">Sign up</button>
        </form>
        <p>Already have an account? <a href="" id="login-link">Login</a></p>
      </div>

      <div class="login-cont" id="login-cont">
        <div class="login-words">
          <h1>Sign in</h1>
          <p>Sign in to start socializing</p>
        </div>
        <form action="" method="" id="login-form">
          <span>
            <label for="login-name"
              >Username <span aria-label="required">*</span></label
            >
            <input type="text" name="login-name" id="login-name" placeholder="eg. Fidel" required/>
          </span>
          <span>
            <label for="login-pass"
              >Password <span aria-label="required">*</span></label
            >
            <input type="password" name="login-pass" id="pass" placeholder="Enter your password" required/>
          </span>
          <button>Login</button>
        </form>
        <p>Don't have an account? <a href="" id="create-link">Sign up</a></p>
      </div>
    </article>
    <article id="add-details">
      <div class="add">
        <div class="add-words">
          <h1>Account Settings</h1>
          <p>Finish creating your profile</p>
        </div>
        <form action="" method="" id="add-form">
          <span id="profile-pic">
            <span id="pic"></span>
            <input type="file" accept="image" name="image" id="image">
            <button type="button">Upload</button>
          </span>
          <span id="others">
            <span>
              <label for="number">Phone number</label>
              <input type="tel" name="number" id="number">
            </span>
            <span>
              <label for="birthday">Birthday</label>
              <input type="date" id="birthday" name="birthday">
            </span>
            <span>
              <label for="gender">Gender</label>
              <select name="gender" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </span>
            <span>
              <label for="country">Country</label>
              <input type="text" name="country" id="country">
            </span>
          </span>
          <span id="bio">
            <label for="desc">Bio</label>
            <textarea name="desc" id="desc" placeholder="Write a short description about yourself"></textarea>
          </span>
          <button type="submit">Submit</button>
        </form>
      </div>
    </article>
    <script src="login.js"></script>
  </body>
</html>
